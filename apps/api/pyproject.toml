[project]
name = "cedeon-api"
version = "0.1.0"
description = "Cedeon API — reinsurance intelligence from contract to recovery"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "structlog>=24.4",
    "uuid-utils>=0.10",
    "procrastinate>=3.0",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.12",
    "email-validator>=2.2",
    "pymupdf>=1.24",
    "aioboto3>=13.0",
    "opentelemetry-api>=1.29",
    "opentelemetry-sdk>=1.29",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-asyncpg>=0.50b0",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
]
# Heavy VLM parser — installed only in the worker image (Phase 2 follow-up), never in CI.
docling = [
    "docling>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "hypothesis>=6.112",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.7",
    "mypy>=1.13",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true

# --- Ruff ---
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802", "N806"]
"app/db/migrations/**" = ["N999", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# --- Mypy ---
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# The pure calculation + money domain is held to the strictest standard.
module = ["app.domain.*"]
disallow_any_generics = true
disallow_untyped_calls = true
warn_return_any = true

[[tool.mypy.overrides]]
module = [
    "procrastinate.*",
    "uuid_utils.*",
    "aioboto3.*",
    "botocore.*",
    "docling.*",
    "opentelemetry.exporter.*",
    "opentelemetry.instrumentation.*",
]
ignore_missing_imports = true

# --- Pytest ---
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "db: test requires a PostgreSQL container",
    "e2e: end-to-end vertical-slice test",
]
filterwarnings = [
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]

# --- import-linter: keep the domain pure ---
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is pure (no framework/infra imports)"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "fastapi",
    "sqlalchemy",
    "alembic",
    "starlette",
    "httpx",
    "procrastinate",
    "app.db",
    "app.api",
    "app.repositories",
    "app.services",
    "app.jobs",
    "app.ai",
]

[[tool.importlinter.contracts]]
name = "Layering: domain <- services <- api"
type = "layers"
layers = [
    "app.api",
    "app.services",
    "app.repositories",
    "app.domain",
]
