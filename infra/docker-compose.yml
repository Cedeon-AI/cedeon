name: cedeon

# Host ports are overridable (some dev machines already use 3000/8000/5432):
#   CEDEON_WEB_PORT=3100 CEDEON_API_PORT=8010 CEDEON_PG_PORT=5434 docker compose -f infra/docker-compose.yml up

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cedeon
      POSTGRES_PASSWORD: cedeon
      POSTGRES_DB: cedeon
    ports:
      - "${CEDEON_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cedeon"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cedeon
      MINIO_ROOT_PASSWORD: cedeon-secret
    ports:
      - "${CEDEON_MINIO_PORT:-9100}:9000"
      - "${CEDEON_MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 cedeon cedeon-secret &&
      mc mb --ignore-existing local/cedeon-local &&
      echo 'bucket ready'
      "

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CEDEON_ENV: local
      CEDEON_DATABASE_URL: postgresql+asyncpg://cedeon:cedeon@postgres:5432/cedeon
      CEDEON_DATABASE_URL_SYNC: postgresql+psycopg://cedeon:cedeon@postgres:5432/cedeon
      CEDEON_SESSION_SECRET: local-dev-session-secret-change-me-0000000000000000
      CEDEON_OBJECT_STORE: s3
      CEDEON_S3_ENDPOINT_URL: http://minio:9000
      CEDEON_S3_BUCKET: cedeon-local
      CEDEON_S3_ACCESS_KEY_ID: cedeon
      CEDEON_S3_SECRET_ACCESS_KEY: cedeon-secret
      CEDEON_LOG_JSON: "true"
    ports:
      - "${CEDEON_API_PORT:-8000}:8000"

  worker:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      CEDEON_ENV: local
      CEDEON_DATABASE_URL: postgresql+asyncpg://cedeon:cedeon@postgres:5432/cedeon
      CEDEON_DATABASE_URL_SYNC: postgresql+psycopg://cedeon:cedeon@postgres:5432/cedeon
      CEDEON_SESSION_SECRET: local-dev-session-secret-change-me-0000000000000000
      CEDEON_OBJECT_STORE: s3
      CEDEON_S3_ENDPOINT_URL: http://minio:9000
      CEDEON_S3_BUCKET: cedeon-local
      CEDEON_S3_ACCESS_KEY_ID: cedeon
      CEDEON_S3_SECRET_ACCESS_KEY: cedeon-secret
      CEDEON_DOCUMENT_PARSER: pymupdf
      CEDEON_LOG_JSON: "true"
    command: >
      sh -c "
      procrastinate --app=app.jobs.app.procrastinate_app schema --apply || true &&
      procrastinate --app=app.jobs.app.procrastinate_app worker
      "

  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    depends_on:
      api:
        condition: service_started
    environment:
      CEDEON_API_INTERNAL_URL: http://api:8000
      NODE_ENV: production
    ports:
      - "${CEDEON_WEB_PORT:-3000}:3000"

volumes:
  pgdata:
  miniodata:
