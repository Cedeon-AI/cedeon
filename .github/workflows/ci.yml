name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
  api:
    name: api (lint · types · tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.x"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run lint-imports
      - run: uv run mypy app
      - run: uv run pytest -q

  web:
    name: web (lint · types · tests · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:client
      - run: pnpm exec biome ci .
      - run: pnpm typecheck
      - run: pnpm test run
      - run: pnpm build

  contract:
    name: openapi contract is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.x"
          enable-cache: true
      - run: uv python install 3.12
      - working-directory: apps/api
        run: uv sync --frozen
      - working-directory: apps/api
        run: uv run python -m app.scripts.export_openapi > ../../packages/openapi/openapi.json
      - name: fail if packages/openapi/openapi.json is stale
        run: git diff --exit-code -- packages/openapi/openapi.json
